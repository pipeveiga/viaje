<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TripDesk · Europa 2026</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="style.css" />
</head>
<body class="min-h-screen text-slate-100">
  <div class="max-w-6xl mx-auto px-4 py-6 md:py-10">
    <!-- Header -->
    <header class="mb-8">
      <div class="flex flex-col md:flex-row md:items-end md:justify-between gap-4">
        <div>
          <p class="text-xs uppercase tracking-widest text-blue-400" id="traveler">Felipe Veiga</p>
          <h1 class="text-3xl md:text-4xl font-bold" id="trip-name">Europa 2026</h1>
          <p class="text-slate-400 mt-1" id="trip-meta">Cargando…</p>
        </div>
        <div class="flex items-center gap-3">
          <div class="bg-slate-800/60 border border-slate-700 rounded-xl px-4 py-3 text-center">
            <div class="text-xs uppercase tracking-wider text-slate-400">Estado</div>
            <div class="text-lg font-semibold" id="countdown">—</div>
          </div>
          <button
            id="btn-config"
            class="bg-slate-800/60 border border-slate-700 rounded-xl px-3 py-3 hover:border-blue-500"
            title="Configurar tipo de cambio"
          >⚙️</button>
        </div>
      </div>
    </header>

    <!-- Summary cards -->
    <section class="grid grid-cols-2 lg:grid-cols-4 gap-3 md:gap-4 mb-8" id="summary-cards">
      <!-- filled by JS -->
    </section>

    <!-- Tabs -->
    <nav class="flex gap-2 mb-4 border-b border-slate-800 overflow-x-auto">
      <button class="tab-btn active" data-tab="itinerary">Itinerario</button>
      <button class="tab-btn" data-tab="checklist">Pagos anticipados</button>
      <button class="tab-btn" data-tab="documents">Documentos</button>
    </nav>

    <!-- Itinerary -->
    <section id="tab-itinerary" class="tab-content">
      <div class="bg-slate-800/40 border border-slate-700 rounded-xl overflow-hidden">
        <div class="overflow-x-auto">
          <table class="w-full text-sm">
            <thead class="bg-slate-800/80 text-slate-300 uppercase text-xs">
              <tr>
                <th class="px-3 py-3 text-left">Día</th>
                <th class="px-3 py-3 text-left">Fecha</th>
                <th class="px-3 py-3 text-left">Ciudad</th>
                <th class="px-3 py-3 text-left">Actividad</th>
                <th class="px-3 py-3 text-right">Est. (€)</th>
                <th class="px-3 py-3 text-right">Real (€)</th>
                <th class="px-3 py-3 text-center">Estado</th>
              </tr>
            </thead>
            <tbody id="itinerary-body"></tbody>
          </table>
        </div>
      </div>
    </section>

    <!-- Checklist -->
    <section id="tab-checklist" class="tab-content hidden">
      <div class="grid gap-3" id="checklist-list"></div>
    </section>

    <!-- Documents -->
    <section id="tab-documents" class="tab-content hidden">
      <div class="bg-slate-800/40 border border-slate-700 rounded-xl p-4 mb-4">
        <h3 class="font-semibold mb-3">Subir documento</h3>
        <form id="upload-form" class="grid md:grid-cols-2 gap-3">
          <input type="file" name="file" required class="input" accept="image/*,.pdf" />
          <select name="doc_type" class="input">
            <option value="factura">Factura</option>
            <option value="reserva">Reserva</option>
            <option value="ticket">Ticket</option>
            <option value="otro" selected>Otro</option>
          </select>
          <input type="text" name="description" placeholder="Descripción" class="input md:col-span-2" />
          <input type="number" step="0.01" name="amount_eur" placeholder="Monto (€)" class="input" />
          <input type="date" name="date" class="input" />
          <input type="text" name="provider" placeholder="Proveedor" class="input" />
          <input type="text" name="reservation_number" placeholder="N° reserva" class="input" />
          <input type="number" name="day_number" min="1" max="22" placeholder="Día del viaje (1-22)" class="input md:col-span-2" />
          <button type="submit" class="btn-primary md:col-span-2">Subir</button>
        </form>
      </div>
      <div class="grid gap-3" id="documents-list"></div>
    </section>
  </div>

  <!-- Config modal -->
  <div id="config-modal" class="hidden fixed inset-0 bg-black/60 z-50 flex items-center justify-center p-4">
    <div class="bg-slate-900 border border-slate-700 rounded-2xl p-6 max-w-md w-full">
      <h2 class="text-xl font-semibold mb-4">Configuración</h2>
      <label class="block text-sm text-slate-300 mb-1">Tipo de cambio EUR/USD</label>
      <input id="config-rate" type="number" step="0.001" class="input w-full mb-4" />
      <div class="flex justify-end gap-2">
        <button id="config-cancel" class="btn-secondary">Cancelar</button>
        <button id="config-save" class="btn-primary">Guardar</button>
      </div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
